# Workflow reutilizável de CI para projetos Node.js (npm ou pnpm).
#
# Uso em qualquer repositório da org (.github/workflows/ci.yml):
#
#   jobs:
#     ci:
#       uses: WinNext-Tech/.github/.github/workflows/ci-node.yml@main
#
# - Detecta pnpm (pnpm-lock.yaml) ou npm (package-lock.json).
# - Usa a versão do Node do .nvmrc / .node-version; sem eles, usa `node-version` (padrão 24).
# - Roda, em ordem, os scripts de `scripts` que existirem no package.json (os ausentes são ignorados).
name: ci-node

on:
  workflow_call:
    inputs:
      working-directory:
        description: Pasta do projeto dentro do repositório (útil em monorepos)
        type: string
        default: "."
      node-version:
        description: Versão do Node quando o projeto não tem .nvmrc nem .node-version
        type: string
        default: "24"
      scripts:
        description: Scripts do package.json a rodar, em ordem, separados por espaço
        type: string
        default: "lint typecheck test build"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Detectar gerenciador de pacotes e versão do Node
        id: detect
        env:
          WORKDIR: ${{ inputs.working-directory }}
        run: |
          # O lockfile pode estar na pasta do projeto ou na raiz (monorepo).
          # Caminhos de saída são relativos à raiz do repositório.
          if [ -f pnpm-lock.yaml ]; then pm=pnpm; base="$WORKDIR"
          elif [ -f "$GITHUB_WORKSPACE/pnpm-lock.yaml" ]; then pm=pnpm; base="."
          elif [ -f package-lock.json ]; then pm=npm; base="$WORKDIR"
          elif [ -f "$GITHUB_WORKSPACE/package-lock.json" ]; then pm=npm; base="."
          else
            echo "::error::Nenhum lockfile encontrado (pnpm-lock.yaml ou package-lock.json). Commite o lockfile."
            exit 1
          fi
          if [ "$pm" = pnpm ]; then lock="$base/pnpm-lock.yaml"; else lock="$base/package-lock.json"; fi
          echo "pm=$pm" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "lock=$lock" >> "$GITHUB_OUTPUT"
          echo "pkgjson=$base/package.json" >> "$GITHUB_OUTPUT"

          # pnpm: a versão vem do campo "packageManager" do package.json (recomendado).
          if [ "$pm" = pnpm ] && ! grep -q '"packageManager"' "$GITHUB_WORKSPACE/$base/package.json"; then
            echo "::warning::Declare \"packageManager\": \"pnpm@<versão>\" no package.json para fixar a versão do pnpm. Usando a mais recente."
            echo "pnpm-version=latest" >> "$GITHUB_OUTPUT"
          fi

          # Versão do Node: .nvmrc/.node-version da pasta do projeto, senão da raiz.
          for f in "$WORKDIR/.nvmrc" "$WORKDIR/.node-version" ".nvmrc" ".node-version"; do
            if [ -f "$GITHUB_WORKSPACE/$f" ]; then echo "node-file=$f" >> "$GITHUB_OUTPUT"; break; fi
          done

      - name: Instalar pnpm
        if: steps.detect.outputs.pm == 'pnpm'
        uses: pnpm/action-setup@v5
        with:
          version: ${{ steps.detect.outputs.pnpm-version }}
          package_json_file: ${{ steps.detect.outputs.pkgjson }}

      - name: Instalar Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.detect.outputs.node-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ steps.detect.outputs.node-file }}
          cache: ${{ steps.detect.outputs.pm }}
          cache-dependency-path: ${{ steps.detect.outputs.lock }}

      - name: Instalar dependências
        # Instala onde está o lockfile (na raiz, em monorepos)
        working-directory: ${{ steps.detect.outputs.base }}
        env:
          PM: ${{ steps.detect.outputs.pm }}
        run: |
          if [ "$PM" = pnpm ]; then pnpm install --frozen-lockfile; else npm ci; fi

      - name: Rodar scripts
        env:
          PM: ${{ steps.detect.outputs.pm }}
          SCRIPTS: ${{ inputs.scripts }}
        run: |
          for s in $SCRIPTS; do
            echo "::group::$PM run $s"
            "$PM" run --if-present "$s"
            echo "::endgroup::"
          done
