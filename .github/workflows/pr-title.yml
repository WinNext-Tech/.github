# Workflow reutilizável: valida o título do PR no padrão Conventional Commits.
# Com squash merge, o título do PR vira a mensagem do commit na main.
#
# Uso (.github/workflows/pr-title.yml no repositório):
#
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened]
#   jobs:
#     pr-title:
#       uses: WinNext-Tech/.github/.github/workflows/pr-title.yml@main
name: pr-title

on:
  workflow_call:

permissions: {}

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validar título do PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert'
          pattern="^($types)(\([a-z0-9._/-]+\))?!?: [^ ].*"
          if [[ "$TITLE" =~ $pattern ]]; then
            echo "Título OK."
            exit 0
          fi
          echo "Título recebido: $TITLE"
          echo "::error::Título fora do padrão Conventional Commits. Exemplos: 'feat(auth): adiciona login com Google' ou 'fix: corrige cálculo do frete'. Tipos aceitos: ${types//|/, }."
          exit 1
