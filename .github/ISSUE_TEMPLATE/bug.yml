name: 🐛 Bug
description: Algo não funciona como deveria
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema com o máximo de clareza.
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Acesse ...
        2. Clique em ...
        3. Veja o erro ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado?
    validations:
      required: true
  - type: dropdown
    id: ambiente
    attributes:
      label: Ambiente
      options:
        - Produção
        - Homologação
        - Local
    validations:
      required: true
  - type: dropdown
    id: impacto
    attributes:
      label: Impacto
      options:
        - Bloqueia o uso (crítico)
        - Atrapalha, mas tem contorno
        - Baixo / cosmético
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências
      description: Prints, vídeo, logs, links, navegador/dispositivo.
